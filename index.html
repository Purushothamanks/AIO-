<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIO Platform - AI Tools Directory</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #16213e;
      --text-primary: #e0e0e0;
      --text-secondary: #b0b0b0;
      --accent-1: #00d4ff;
      --accent-2: #ff00aa;
      --accent-3: #ffd700;
      --card-bg: rgba(255, 255, 255, 0.08);
      --navbar-bg: rgba(10, 10, 15, 0.9);
      --modal-bg: rgba(255, 255, 255, 0.1);
      --success: #00ff88;
      --warning: #ffaa00;
      --error: #ff4444;
    }

    body.light-mode {
      --bg-primary: #f0f2f5;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e4e6eb;
      --text-primary: #1a1a1a;
      --text-secondary: #4a4a4a;
      --accent-1: #0077cc;
      --accent-2: #cc0066;
      --accent-3: #cc9900;
      --card-bg: rgba(255, 255, 255, 0.9);
      --navbar-bg: rgba(255, 255, 255, 0.9);
      --modal-bg: rgba(255, 255, 255, 0.95);
      --success: #00aa55;
      --warning: #cc8800;
      --error: #cc3333;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(
        135deg,
        var(--bg-primary) 0%,
        var(--bg-secondary) 50%,
        var(--bg-tertiary) 100%
      );
      color: var(--text-primary);
      overflow-x: hidden;
      line-height: 1.6;
      min-height: 100vh;
      transition: all 0.5s ease;
    }

    /* Page Container */
    .page-container {
      display: none;
      min-height: 100vh;
      padding-top: 80px;
    }

    .page-container.active {
      display: block;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1rem 2rem;
      background: var(--navbar-bg);
      backdrop-filter: blur(20px);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .navbar.scrolled {
      background: var(--navbar-bg);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
    }

    .navbar h2 {
      font-size: 1.8rem;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .navbar .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .navbar a {
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
      cursor: pointer;
    }

    .navbar a:hover {
      color: var(--accent-1);
    }

    .navbar .theme-toggle {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .navbar .theme-toggle:hover {
      transform: scale(1.1);
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Home Page */
    .home-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .home-page::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(
          circle at 30% 40%,
          rgba(0, 212, 255, 0.2) 0%,
          transparent 50%
        ),
        radial-gradient(
          circle at 70% 60%,
          rgba(255, 0, 170, 0.2) 0%,
          transparent 50%
        );
      animation: pulse 4s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% {
        opacity: 0.5;
      }
      100% {
        opacity: 1;
      }
    }

    .home-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .home-title {
      font-size: 4rem;
      background: linear-gradient(
        90deg,
        var(--accent-1),
        var(--accent-2),
        var(--accent-3)
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
      animation: textGlow 2s ease-in-out infinite alternate;
    }

    @keyframes textGlow {
      0% {
        filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5));
      }
      100% {
        filter: drop-shadow(0 0 20px rgba(255, 0, 170, 0.8));
      }
    }

    .home-subtitle {
      font-size: 1.5rem;
      margin-bottom: 3rem;
      color: var(--text-secondary);
    }

    .ai-animation {
      width: 300px;
      height: 300px;
      margin: 0 auto 3rem;
      position: relative;
    }

    .ai-core {
      width: 100px;
      height: 100px;
      background: linear-gradient(45deg, var(--accent-1), var(--accent-2));
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseCore 3s infinite alternate;
    }

    @keyframes pulseCore {
      0% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 30px var(--accent-1);
      }
      100% {
        transform: translate(-50%, -50%) scale(1.2);
        box-shadow: 0 0 60px var(--accent-2);
      }
    }

    .ai-orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border: 2px solid rgba(0, 212, 255, 0.3);
      border-radius: 50%;
      animation: rotate 20s linear infinite;
    }

    .ai-node {
      width: 20px;
      height: 20px;
      background: var(--accent-3);
      border-radius: 50%;
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      animation: glowNode 2s infinite alternate;
    }

    @keyframes glowNode {
      0% {
        box-shadow: 0 0 10px var(--accent-3);
      }
      100% {
        box-shadow: 0 0 20px var(--accent-3);
      }
    }

    @keyframes rotate {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    .btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      border-radius: 30px;
      color: #fff;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      margin: 1rem;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.5);
    }

    .home-stats {
      display: flex;
      justify-content: center;
      gap: 3rem;
      margin: 3rem 0;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
      animation: fadeInUp 1s ease;
    }

    .stat h3 {
      font-size: 3rem;
      color: var(--accent-1);
      margin-bottom: 0.5rem;
    }

    .stat p {
      font-size: 1.2rem;
      color: var(--text-secondary);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .home-contact {
      margin-top: 4rem;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .home-contact h2 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .contact-info {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
    }

    .contact-item i {
      color: var(--accent-1);
      font-size: 1.2rem;
    }

    /* Tools Page */
    .tools-page {
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 3rem;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tools-controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .tools-controls input,
    .tools-controls select {
      padding: 1rem 1.5rem;
      border-radius: 50px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .tools-controls input:focus,
    .tools-controls select:focus {
      outline: none;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
      background: rgba(255, 255, 255, 0.2);
    }

    .tools-controls input {
      width: 300px;
    }

    .tools-controls input::placeholder {
      color: #aaa;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2.5rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 2rem;
      text-align: center;
      transition: all 0.4s ease;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(0, 212, 255, 0.2),
        rgba(255, 0, 170, 0.2),
        transparent
      );
      transition: left 0.6s ease;
    }

    .card:hover::before {
      left: 100%;
    }

    .card:hover {
      transform: translateY(-15px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0, 212, 255, 0.3),
        0 0 30px rgba(255, 0, 170, 0.3);
    }

    .card img {
      width: 140px;
      height: 140px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .card:hover img {
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
    }

    .card h3 {
      margin: 0.5rem 0;
      font-size: 1.4rem;
      color: var(--text-primary);
    }

    .card p {
      height: 70px;
      overflow: hidden;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1rem;
      color: var(--text-secondary);
    }

    .category {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 25px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0.5rem 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: white;
    }

    /* Contact Page */
    .contact-page {
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .contact-form {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 3rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 1rem;
      border-radius: 15px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
      background: rgba(255, 255, 255, 0.2);
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }

    /* Footer */
    .footer {
      padding: 3rem 2rem 2rem;
      background: var(--navbar-bg);
      backdrop-filter: blur(20px);
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 4rem;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .footer-social {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .footer-social a {
      color: var(--text-secondary);
      font-size: 1.5rem;
      transition: color 0.3s ease;
    }

    .footer-social a:hover {
      color: var(--accent-2);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      backdrop-filter: blur(10px);
    }

    .modal {
      background: var(--modal-bg);
      border-radius: 25px;
      padding: 3rem;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: modalAppear 0.3s ease;
    }

    @keyframes modalAppear {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal img {
      width: 200px;
      height: 200px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      object-fit: cover;
    }

    .modal h3 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .modal p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      color: var(--text-secondary);
    }

    .tool-link {
      display: inline-block;
      padding: 1rem 2rem;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }

    .tool-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 212, 255, 0.4);
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Resources Page */
    .resources-page {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .resources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .resource-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }

    .resource-card:hover {
      transform: translateY(-10px);
    }

    .resource-icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      color: var(--accent-1);
    }

    .resource-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .resource-description {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .resource-content-page {
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
      min-height: 80vh;
    }

    .resource-content {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 3rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .resource-content h2 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      color: var(--text-primary);
      text-align: center;
    }

    .resource-content p {
      margin-bottom: 1.5rem;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .resource-content ul {
      margin-bottom: 1.5rem;
      padding-left: 2rem;
      color: var(--text-secondary);
    }

    .resource-content li {
      margin-bottom: 0.5rem;
    }

    /* Profile Page */
    .profile-page {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .developer-hero {
      text-align: center;
      margin-bottom: 4rem;
      padding: 4rem 2rem;
      background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
      border-radius: 25px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .developer-hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><pattern id='grid' width='10' height='10' patternUnits='userSpaceOnUse'><path d='M 10 0 L 0 0 0 10' fill='none' stroke='rgba(255,255,255,0.1)' stroke-width='1'/></pattern></defs><rect width='100' height='100' fill='url(%23grid)'/></svg>");
    }

    .developer-avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 4px solid white;
      margin: 0 auto 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      object-fit: cover;
    }

    .developer-hero h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
    }

    .developer-hero p {
      font-size: 1.5rem;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    .developer-tagline {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #f5f5f5;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      margin: 3rem 0;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-card i {
      font-size: 3rem;
      color: var(--accent-1);
      margin-bottom: 1rem;
    }

    .stat-card h3 {
      font-size: 2.5rem;
      color: var(--accent-1);
      margin-bottom: 0.5rem;
    }

    .stat-card p {
      color: var(--text-secondary);
    }

    .developer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .developer-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .developer-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    }

    .developer-card:hover {
      transform: translateY(-10px);
    }

    .developer-card h3 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .developer-card h3 i {
      color: var(--accent-1);
    }

    /* AI Assistant */
    .ai-assistant {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
    }

    .ai-assistant-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
      transition: all 0.3s ease;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .ai-assistant-icon:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 30px rgba(0, 212, 255, 0.6);
    }

    .ai-assistant-chat {
      position: fixed;
      bottom: 90px;
      left: 20px;
      width: 350px;
      height: 500px;
      background: var(--modal-bg);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      z-index: 1001;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .ai-assistant-chat.active {
      display: flex;
    }

    .chat-header {
      padding: 1.5rem;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h3 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .close-chat {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 1rem;
      border-radius: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.ai {
      background: rgba(0, 212, 255, 0.1);
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .message.user {
      background: rgba(255, 0, 170, 0.1);
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .chat-input {
      padding: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 1rem;
    }

    .chat-input input {
      flex: 1;
      padding: 1rem;
      border-radius: 25px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      font-size: 1rem;
    }

    .chat-input input:focus {
      outline: none;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    .send-btn {
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      border: none;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .send-btn:hover {
      transform: scale(1.1);
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    .typing-dots {
      display: flex;
      gap: 0.2rem;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-1);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .typing-dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes typing {
      0%,
      80%,
      100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Mobile Menu */
    .mobile-menu {
      position: fixed;
      top: 80px;
      left: 0;
      width: 100%;
      background: var(--navbar-bg);
      backdrop-filter: blur(20px);
      z-index: 999;
      display: none;
      flex-direction: column;
      padding: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .mobile-menu.active {
      display: flex;
    }

    .mobile-menu a {
      padding: 1rem;
      color: var(--text-primary);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      transition: color 0.3s ease;
      cursor: pointer;
    }

    .mobile-menu a:hover {
      color: var(--accent-1);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .navbar {
        padding: 1rem;
      }

      .navbar .nav-links {
        display: none;
      }

      .mobile-menu-btn {
        display: block;
      }

      .home-title {
        font-size: 2.5rem;
      }

      .home-subtitle {
        font-size: 1.2rem;
      }

      .ai-animation {
        width: 200px;
        height: 200px;
      }

      .ai-core {
        width: 70px;
        height: 70px;
      }

      .ai-orbit {
        width: 150px;
        height: 150px;
      }

      .home-stats {
        gap: 2rem;
      }

      .stat h3 {
        font-size: 2rem;
      }

      .tools-controls {
        flex-direction: column;
        align-items: center;
      }

      .tools-controls input {
        width: 100%;
        max-width: 300px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 2.5rem;
      }

      .developer-hero h1 {
        font-size: 2.5rem;
      }

      .developer-hero p {
        font-size: 1.2rem;
      }

      .developer-grid {
        grid-template-columns: 1fr;
      }

      .ai-assistant-chat {
        width: calc(100vw - 40px);
        left: 20px;
        right: 20px;
      }

      .contact-info {
        flex-direction: column;
        gap: 1rem;
      }

      .contact-form {
        padding: 2rem;
      }

      .modal {
        padding: 2rem;
      }

      .stats-container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .home-title {
        font-size: 2rem;
      }

      .home-subtitle {
        font-size: 1rem;
      }

      .page-title {
        font-size: 2rem;
      }

      .card {
        padding: 1.5rem;
      }

      .card img {
        width: 100px;
        height: 100px;
      }

      .resource-card {
        padding: 1.5rem;
      }

      .developer-hero {
        padding: 2rem 1rem;
      }

      .developer-card {
        padding: 1.5rem;
      }

      .resource-content {
        padding: 2rem;
      }

      .ai-assistant-icon {
        width: 50px;
        height: 50px;
        font-size: 1.2rem;
      }

      .stat-card {
        padding: 1.5rem;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--accent-1), var(--accent-2));
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(var(--accent-2), var(--accent-1));
    }

    /* Selection Color */
    ::selection {
      background: var(--accent-1);
      color: white;
    }

    ::-moz-selection {
      background: var(--accent-1);
      color: white;
    }
  </style>

    function App() {
      const [tools, setTools] = useState([]);
      const [category, setCategory] = useState("All");
      const [search, setSearch] = useState("");
      const [loading, setLoading] = useState(true);
      const [modalTool, setModalTool] = useState(null);
      const [scrolled, setScrolled] = useState(false);
      const [darkMode, setDarkMode] = useState(true);
      const [activePage, setActivePage] = useState("home");
      const [resourceContent, setResourceContent] = useState(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [aiAssistantOpen, setAiAssistantOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { type: "ai", text: "Hello! I'm your AI assistant. How can I help you today?" }
      ]);
      const [userInput, setUserInput] = useState("");
      const [isTyping, setIsTyping] = useState(false);

      // Toggle dark/light mode
      const toggleTheme = () => {
        setDarkMode(!darkMode);
        document.body.classList.toggle("light-mode");
      };

      // Navbar scroll effect
      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 50);
        };
        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      // Load tools (simulate API)
      useEffect(() => {
        setTimeout(() => {
          setTools(realAITools);
          setLoading(false);
        }, 800);
      }, []);

      const categories = ["All", ...new Set(tools.map((t) => t.category))];

      const filteredTools = tools.filter(
        (t) =>
          (category === "All" || t.category === category) &&
          t.name.toLowerCase().includes(search.toLowerCase())
      );

      const openTool = (tool, event) => {
        event.stopPropagation();
        window.open(tool.link, "_blank");
      };

      const navigateTo = (page) => {
        setActivePage(page);
        setResourceContent(null);
        setMobileMenuOpen(false);
        window.scrollTo(0, 0);
      };

      const showResourceContent = (type) => {
        setResourceContent(type);
      };

      const toggleMobileMenu = () => {
        setMobileMenuOpen((prev) => !prev);
      };

      const toggleAiAssistant = () => {
        setAiAssistantOpen((prev) => !prev);
      };

      const handleChatInput = (e) => {
        setUserInput(e.target.value);
      };

      // Gemini backend chat
      const sendMessage = async () => {
        if (userInput.trim() === "") return;

        const newMessages = [...chatMessages, { type: "user", text: userInput }];
        setChatMessages(newMessages);
        setUserInput("");
        setIsTyping(true);

        try {
          const response = await fetch("http://localhost:3001/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: userInput })
          });

          const data = await response.json();

          setChatMessages([
            ...newMessages,
            { type: "ai", text: data.reply || "No reply from Gemini server." }
          ]);
        } catch (err) {
          setChatMessages([
            ...newMessages,
            { type: "ai", text: "⚠️ Gemini server not responding. Check backend." }
          ]);
        } finally {
          setIsTyping(false);
        }
      };

      const handleKeyPress = (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendMessage();
        }
      };

      return (
        <div>
          {/* AI Assistant */}
          <div className="ai-assistant">
            <div className="ai-assistant-icon" onClick={toggleAiAssistant}>
              <i className="fas fa-robot"></i>
            </div>
            <div
              className={
                "ai-assistant-chat " + (aiAssistantOpen ? "active" : "")
              }
            >
              <div className="chat-header">
                <h3>
                  <i className="fas fa-robot"></i> AI Assistant
                </h3>
                <button className="close-chat" onClick={toggleAiAssistant}>
                  <i className="fas fa-times"></i>
                </button>
              </div>
              <div className="chat-messages">
                {chatMessages.map((msg, idx) => (
                  <div key={idx} className={"message " + msg.type}>

                  </div>
                ))}

                <i className={darkMode ? "fas fa-sun" : "fas fa-moon"}></i>
              </button>
            </div>
            <button className="mobile-menu-btn" onClick={toggleMobileMenu}>
              <i className="fas fa-bars"></i>
            </button>
          </nav>

          {/* Mobile Menu */}
          <div className={"mobile-menu " + (mobileMenuOpen ? "active" : "")}>
            <a onClick={() => navigateTo("home")}>Home</a>
            <a onClick={() => navigateTo("tools")}>Tools</a>
            <a onClick={() => navigateTo("resources")}>Resources</a>
            <a onClick={() => navigateTo("profile")}>Developer</a>
            <a onClick={() => navigateTo("contact")}>Contact</a>
            <button
              className="theme-toggle"
              onClick={toggleTheme}
              style={{
                background: "none",
                border: "none",
                color: "var(--text-primary)",
                padding: "1rem",
                textAlign: "left",
                width: "100%"
              }}
            >
              <i className={darkMode ? "fas fa-sun" : "fas fa-moon"}></i>{" "}
              {darkMode ? "Light Mode" : "Dark Mode"}
            </button>
          </div>

          {/* Home Page */}
          <div
            className={
              "page-container " + (activePage === "home" ? "active" : "")
            }
          >
            <section className="home-page">
              <div className="home-content">
                <div className="ai-animation">
                  <div className="ai-core"></div>
                  <div className="ai-orbit">
                    <div className="ai-node"></div>
                  </div>
                </div>
                <h1 className="home-title">Discover the Future of AI</h1>
                <p className="home-subtitle">
                  Explore the most powerful AI tools in one comprehensive
                  platform
                </p>
                <button className="btn" onClick={() => navigateTo("tools")}>
                  Explore Tools
                </button>

                <div className="home-stats">
                  <div className="stat">
                    <h3>{tools.length}</h3>
                    <p>AI Tools</p>
                  </div>
                  <div className="stat">
                    <h3>{categories.length - 1}</h3>
                    <p>Categories</p>
                  </div>
                  <div className="stat">
                    <h3>500+</h3>
                    <p>Users Worldwide</p>
                  </div>
                </div>

                <div className="home-contact">
                  <h2>Contact Us</h2>
                  <div className="contact-info">
                    <div className="contact-item">
                      <i className="fas fa-envelope"></i>
                      <span>purushothamanks1711@gmail.com</span>
                    </div>
                    <div className="contact-item">
                      <i className="fas fa-phone"></i>
                      <span>+91 9487120719</span>
                    </div>
                    <div className="contact-item">
                      <i className="fas fa-map-marker-alt"></i>
                      <span>India , TamilNadu , Salem</span>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>

          {/* Tools Page */}
          <div
            className={
              "page-container " + (activePage === "tools" ? "active" : "")
            }
          >
            <section className="tools-page">
              <h2 className="page-title">AI Tools Directory</h2>
              <div className="tools-controls">
                <input
                  type="text"
                  placeholder="Search tools..."
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                />
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                >
                  {categories.map((c) => (
                    <option key={c} value={c}>
                      {c}
                    </option>
                  ))}
                </select>
              </div>
              <div className="grid">
                {loading ? (
                  Array.from({ length: 6 }).map((_, i) => (
                    <div key={i} className="card skeleton"></div>
                  ))
                ) : filteredTools.length === 0 ? (
                  <p
                    style={{
                      gridColumn: "1/-1",
                      textAlign: "center",
                      color: "var(--text-secondary)",
                      fontSize: "1.2rem"
                    }}
                  >
                    No tools found matching your criteria
                  </p>
                ) : (
                  filteredTools.map((tool) => (
                    <div
                      key={tool._id}
                      className="card"
                      onClick={() => setModalTool(tool)}
                    >
                      <img src={tool.image} alt={tool.name} />
                      <h3>{tool.name}</h3>
                      <p>{tool.description}</p>
                      <div className="category">{tool.category}</div>
                      <button
                        className="btn"
                        onClick={(e) => openTool(tool, e)}
                      >
                        Open Tool
                      </button>
                    </div>
                  ))
                )}
              </div>
            </section>
          </div>

          {/* Resources Page */}
          <div
            className={
              "page-container " + (activePage === "resources" ? "active" : "")
            }
          >
            {!resourceContent ? (
              <section className="resources-page">
                <h2 className="page-title">Learning Resources</h2>
                <div className="resources-grid">
                  <div className="resource-card">
                    <div className="resource-icon">
                      <i className="fas fa-book"></i>
                    </div>
                    <h3 className="resource-title">AI Guides</h3>
                    <p className="resource-description">
                      Comprehensive guides to understand and implement AI
                      technologies in your projects.
                    </p>
                    <button
                      className="btn"
                      onClick={() => showResourceContent("guides")}
                    >
                      Explore Guides
                    </button>
                  </div>

                  <div className="resource-card">
                    <div className="resource-icon">
                      <i className="fas fa-video"></i>
                    </div>
                    <h3 className="resource-title">Video Tutorials</h3>
                    <p className="resource-description">
                      Step-by-step video tutorials to help you master AI tools
                      and techniques.
                    </p>
                    <button
                      className="btn"
                      onClick={() => showResourceContent("tutorials")}
                    >
                      Watch Tutorials
                    </button>
                  </div>

                  <div className="resource-card">
                    <div className="resource-icon">
                      <i className="fas fa-laptop-code"></i>
                    </div>
                    <h3 className="resource-title">Code Examples</h3>
                    <p className="resource-description">
                      Real-world code examples and snippets to accelerate your
                      AI development.
                    </p>
                    <button
                      className="btn"
                      onClick={() => showResourceContent("examples")}
                    >
                      View Examples
                    </button>
                  </div>

                  <div className="resource-card">
                    <div className="resource-icon">
                      <i className="fas fa-users"></i>
                    </div>
                    <h3 className="resource-title">Community</h3>
                    <p className="resource-description">
                      Join our community of AI enthusiasts to share knowledge
                      and collaborate.
                    </p>
                    <button
                      className="btn"
                      onClick={() => showResourceContent("community")}
                    >
                      Join Community
                    </button>
                  </div>

                  <div className="resource-card">
                    <div className="resource-icon">
                      <i className="fas fa-tools"></i>
                    </div>
                    <h3 className="resource-title">Tool Comparisons</h3>
                    <p className="resource-description">
                      Detailed comparisons of AI tools to help you choose the
                      right one for your needs.
                    </p>
                    <button
                      className="btn"
                      onClick={() => showResourceContent("comparisons")}
                    >
                      Compare Tools
                    </button>
                  </div>

                  <div className="resource-card">
                    <div className="resource-icon">
                      <i className="fas fa-chart-bar"></i>
                    </div>
                    <h3 className="resource-title">Case Studies</h3>
                    <p className="resource-description">
                      Real-world case studies showing how businesses are
                      leveraging AI tools.
                    </p>
                    <button
                      className="btn"
                      onClick={() => showResourceContent("studies")}
                    >
                      Read Studies
                    </button>
                  </div>
                </div>
              </section>
            ) : (
              <section className="resource-content-page">
                <button
                  className="btn"
                  onClick={() => setResourceContent(null)}
                  style={{ marginBottom: "2rem" }}
                >
                  <i className="fas fa-arrow-left"></i> Back to Resources
                </button>
                <div className="resource-content">
                  <h2>{resourceContents[resourceContent].title}</h2>
                  <div
                    dangerouslySetInnerHTML={{
                      __html: resourceContents[resourceContent].content
                    }}
                  />
                </div>
              </section>
            )}
          </div>

          {/* Profile Page */}
          <div
            className={
              "page-container " + (activePage === "profile" ? "active" : "")
            }
          >
            <section className="profile-page">
              <div className="developer-hero">
                <img
                  src="https://via.placeholder.com/150x150?text=PKS"
                  alt="Developer"
                  className="developer-avatar"
                />
                <h1>Purushothaman KS</h1>
                <p>Web Developer &amp; Platform Architect</p>
                <p className="developer-tagline">
                  Building the future of AI tools since 2025
                </p>
              </div>

              <div className="stats-container">
                <div className="stat-card">
                  <i className="fas fa-map-marker-alt"></i>
                  <h3>India</h3>
                  <p>Location</p>
                </div>
                <div className="stat-card">
                  <i className="fas fa-trophy"></i>
                  <h3>5+</h3>
                  <p>Awards Won</p>
                </div>
                <div className="stat-card">
                  <i className="fas fa-project-diagram"></i>
                  <h3>5+</h3>
                  <p>Projects Completed</p>
                </div>
                <div className="stat-card">
                  <i className="fas fa-users"></i>
                  <h3>10+</h3>
                  <p>Developers Mentored</p>
                </div>
              </div>

              <div className="developer-grid">
                <div className="developer-card">
                  <h3>
                    <i className="fas fa-user"></i> About Me
                  </h3>
                  <p>
                    I'm a passionate web developer with experience in HTML &amp;
                    CSS, React, Java, Node.js, and networking. My mission is to
                    make AI tools accessible to everyone through intuitive
                    platforms like AIO.
                  </p>
                  <p>
                    I specialize in creating seamless user experiences while
                    implementing cutting-edge AI technologies. My work focuses
                    on bridging the gap between complex AI systems and
                    end-users.
                  </p>
                  <p>
                    When I'm not coding, I contribute to open-source AI projects
                    and mentor aspiring developers in the AI space.
                  </p>
                </div>
              </div>
            </section>
          </div>

          {/* Contact Page */}
          <div
            className={
              "page-container " + (activePage === "contact" ? "active" : "")
            }
          >
            <section className="contact-page">
              <h2 className="page-title">Get In Touch</h2>
              <div className="contact-form">
                <div className="form-group">
                  <label htmlFor="name">Your Name</label>
                  <input type="text" id="name" placeholder="Enter your name" />
                </div>
                <div className="form-group">
                  <label htmlFor="email">Email Address</label>
                  <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                  />
                </div>
                <div className="form-group">
                  <label htmlFor="subject">Subject</label>
                  <input
                    type="text"
                    id="subject"
                    placeholder="Enter the subject"
                  />
                </div>
                <div className="form-group">
                  <label htmlFor="message">Your Message</label>
                  <textarea
                    id="message"
                    placeholder="Enter your message"
                  ></textarea>
                </div>
                <button className="btn" style={{ width: "100%" }}>
                  Send Message
                </button>
              </div>
            </section>
          </div>

          {/* Footer */}
          <footer className="footer">
            <div className="footer-content">
              <h3>AIO - The Future Of AI</h3>
              <div className="footer-social">
                <a href="https://www.facebook.com/share/17MjaxdRzd/">
                  <i className="fab fa-facebook-f"></i>
                </a>
                <a href="https://github.com/Purushothamanks">
                  <i className="fab fa-github"></i>
                </a>
                <a href="https://www.instagram.com/candy_boyy_1117?igsh=cndlbmZ4cHJjdmw5">
                  <i className="fab fa-instagram"></i>
                </a>
                <a href="https://www.linkedin.com/in/purushothaman-k-s-158900282">
                  <i className="fab fa-linkedin-in"></i>
                </a>
              </div>
              <p>© 2025 AIO Platform. All rights reserved.</p>
            </div>
          </footer>

          {/* Tool Modal */}
          {modalTool && (
            <div
              className="modal-overlay"
              onClick={() => setModalTool(null)}
            >
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <img src={modalTool.image} alt={modalTool.name} />
                <h3>{modalTool.name}</h3>
                <p>{modalTool.description}</p>
                <a
                  href={modalTool.link}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="tool-link"
                >
                  Visit Website
                </a>
                <button
                  className="close-btn"
                  onClick={() => setModalTool(null)}
                >
                  Close
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
